<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Digital Plantation Operating Model</title>
  <desc id="desc">Architectural operating flow from field operations through estate, district, region, and head office with unified shared capability engines.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08100C"/>
      <stop offset="50%" stop-color="#0D1813"/>
      <stop offset="100%" stop-color="#070E0A"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12231A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0C1712" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Highlight Line Gradient -->
    <linearGradient id="topLineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D5A42" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#4ADE80" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2D5A42" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Backbone Rail Gradient -->
    <linearGradient id="railLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3B341" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#34D399" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Particle Glow -->
    <filter id="pGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Technical Grid Pattern -->
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#224031" stroke-width="0.7" stroke-opacity="0.2"/>
    </pattern>

    <!-- Motion Paths -->
    <path id="pipelineSpine" d="M140 134 H1060"/>
    <path id="flowDown1" d="M240 134 V210"/>
    <path id="flowDown2" d="M440 134 V210"/>
    <path id="flowDown3" d="M600 134 V210"/>
    <path id="flowDown4" d="M760 134 V210"/>
    <path id="flowDown5" d="M960 134 V210"/>

    <style>
      .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes radarPulse {
        0% { r: 12px; opacity: 0.8; }
        100% { r: 24px; opacity: 0; }
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes coreGlow {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; }
      }

      .pulse-beacon {
        animation: radarPulse 3.2s cubic-bezier(0.23, 1, 0.32, 1) infinite;
        transform-origin: 140px 134px;
      }
      .pulse-hq {
        animation: radarPulse 3.2s cubic-bezier(0.23, 1, 0.32, 1) infinite;
        animation-delay: 1.6s;
        transform-origin: 1060px 134px;
      }
      .live-indicator {
        animation: liveBlink 2.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="340" rx="14" fill="url(#dpBg)"/>
  <rect width="1200" height="340" rx="14" fill="url(#techGrid)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="13.5" fill="none" stroke="#1E382B" stroke-width="1"/>

  <!-- Top Metadata Header -->
  <g transform="translate(48, 42)">
    <text x="0" y="0" fill="#4ADE80" font-size="10.5" font-weight="700" letter-spacing="2.4" class="mono">DIGITAL PLANTATION OPERATING MODEL</text>
    <text x="0" y="20" fill="#759983" font-size="12.5" class="sans">Synchronized information flow from operational edges to enterprise governance</text>
  </g>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(1044, 32)" class="mono">
    <rect width="108" height="24" rx="4" fill="#0C1F15" stroke="#1F4733" stroke-width="0.8"/>
    <circle cx="14" cy="12" r="3" fill="#4ADE80" class="live-indicator"/>
    <text x="24" y="15.5" fill="#C6F6D5" font-size="9.5" font-weight="600" letter-spacing="0.8">SYNC ACTIVE</text>
  </g>

  <!-- Technical Conduit Bus Lines (Orthogonal Downward Connectors) -->
  <g stroke="#183626" stroke-width="1">
    <path d="M240 134 V210" stroke-dasharray="2 3"/>
    <path d="M440 134 V210" stroke-dasharray="2 3"/>
    <path d="M600 134 V210" stroke-dasharray="2 3" stroke="#25553C"/>
    <path d="M760 134 V210" stroke-dasharray="2 3"/>
    <path d="M960 134 V210" stroke-dasharray="2 3"/>

    <!-- Junction Dots -->
    <circle cx="240" cy="134" r="2" fill="#2D6043"/>
    <circle cx="440" cy="134" r="2" fill="#2D6043"/>
    <circle cx="600" cy="134" r="2.5" fill="#4ADE80"/>
    <circle cx="760" cy="134" r="2" fill="#2D6043"/>
    <circle cx="960" cy="134" r="2" fill="#2D6043"/>
  </g>

  <!-- Downward Pulse Packets -->
  <circle r="2" fill="#34D399" opacity="0.85">
    <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#flowDown1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#4ADE80" filter="url(#pGlow)">
    <animateMotion dur="2.2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#flowDown3"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.2s" begin="-0.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#34D399" opacity="0.85">
    <animateMotion dur="2.8s" begin="-1.4s" repeatCount="indefinite"><mpath href="#flowDown5"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Main Pipeline Spine Track -->
  <g>
    <path d="M140 134 H1060" stroke="#12281D" stroke-width="4" stroke-linecap="round"/>
    <path d="M140 134 H1060" stroke="#1E4330" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M140 134 H1060" stroke="url(#railLine)" stroke-width="1" stroke-dasharray="3 6" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Calm Flowing Telemetry Packets (Physics-Eased) -->
  <!-- Packet A: Primary Telemetry Pulse (Gold) -->
  <circle r="3.8" fill="#FBBF24" filter="url(#pGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1">
      <mpath href="#pipelineSpine"/>
    </animateMotion>
  </circle>
  <circle r="2" fill="#FEF08A" opacity="0.9">
    <animateMotion dur="6s" begin="-0.06s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1">
      <mpath href="#pipelineSpine"/>
    </animateMotion>
  </circle>

  <!-- Packet B: Synchronized Batch Payload (Emerald) -->
  <circle r="3.2" fill="#34D399" filter="url(#pGlow)">
    <animateMotion dur="6s" begin="-3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1">
      <mpath href="#pipelineSpine"/>
    </animateMotion>
  </circle>
  <circle r="1.8" fill="#A7F3D0" opacity="0.85">
    <animateMotion dur="6s" begin="-3.06s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.25 0.1 0.25 1">
      <mpath href="#pipelineSpine"/>
    </animateMotion>
  </circle>

  <!-- ==================== 5 PIPELINE NODES ==================== -->

  <!-- NODE 01: FIELD -->
  <g transform="translate(140, 134)">
    <circle r="12" fill="none" stroke="#E3B341" stroke-width="1.2" class="pulse-beacon"/>
    <circle r="15" fill="#0C1B14" stroke="#E3B341" stroke-width="1.5"/>
    <circle r="9" fill="#143224" stroke="#36654B" stroke-width="0.8"/>
    <circle r="3.5" fill="#FBBF24"/>

    <g class="mono" text-anchor="middle">
      <text y="-24" fill="#D97706" font-size="9" font-weight="700" letter-spacing="1">01</text>
      <text y="28" fill="#F3F4F6" font-size="11" font-weight="700" letter-spacing="1">FIELD</text>
      <text y="41" fill="#71947F" font-size="9" class="sans">IoT · Harvest · Sensor</text>
    </g>
  </g>

  <!-- NODE 02: ESTATE -->
  <g transform="translate(370, 134)">
    <circle r="14" fill="#0C1B14" stroke="#2B6145" stroke-width="1.4"/>
    <circle r="8" fill="#143224" stroke="#2D5C43" stroke-width="0.8"/>
    <circle r="3" fill="#34D399"/>

    <g class="mono" text-anchor="middle">
      <text y="-24" fill="#4ADE80" font-size="9" font-weight="700" letter-spacing="1">02</text>
      <text y="28" fill="#F3F4F6" font-size="11" font-weight="700" letter-spacing="1">ESTATE</text>
      <text y="41" fill="#71947F" font-size="9" class="sans">Mill · Grading · Yard</text>
    </g>
  </g>

  <!-- NODE 03: DISTRICT -->
  <g transform="translate(600, 134)">
    <circle r="15" fill="#0E2319" stroke="#34D399" stroke-width="1.6"/>
    <circle r="9" fill="#163C2B" stroke="#438563" stroke-width="0.8"/>
    <circle r="3.5" fill="#4ADE80"/>

    <g class="mono" text-anchor="middle">
      <text y="-24" fill="#4ADE80" font-size="9" font-weight="700" letter-spacing="1">03</text>
      <text y="28" fill="#F3F4F6" font-size="11" font-weight="700" letter-spacing="1">DISTRICT</text>
      <text y="41" fill="#71947F" font-size="9" class="sans">Cluster Hub · Relay</text>
    </g>
  </g>

  <!-- NODE 04: REGION -->
  <g transform="translate(830, 134)">
    <circle r="14" fill="#0C1B14" stroke="#2B6145" stroke-width="1.4"/>
    <circle r="8" fill="#143224" stroke="#2D5C43" stroke-width="0.8"/>
    <circle r="3" fill="#34D399"/>

    <g class="mono" text-anchor="middle">
      <text y="-24" fill="#4ADE80" font-size="9" font-weight="700" letter-spacing="1">04</text>
      <text y="28" fill="#F3F4F6" font-size="11" font-weight="700" letter-spacing="1">REGION</text>
      <text y="41" fill="#71947F" font-size="9" class="sans">Regional Ops · Control</text>
    </g>
  </g>

  <!-- NODE 05: HEAD OFFICE -->
  <g transform="translate(1060, 134)">
    <circle r="12" fill="none" stroke="#38BDF8" stroke-width="1.2" class="pulse-hq"/>
    <circle r="15" fill="#0C1B14" stroke="#38BDF8" stroke-width="1.5"/>
    <circle r="9" fill="#142B36" stroke="#326377" stroke-width="0.8"/>
    <circle r="3.5" fill="#38BDF8"/>

    <g class="mono" text-anchor="middle">
      <text y="-24" fill="#38BDF8" font-size="9" font-weight="700" letter-spacing="1">05</text>
      <text y="28" fill="#F3F4F6" font-size="11" font-weight="700" letter-spacing="1">HEAD OFFICE</text>
      <text y="41" fill="#71947F" font-size="9" class="sans">Executive · Governance</text>
    </g>
  </g>

  <!-- ==================== SHARED CAPABILITIES ARCHITECTURAL DOCK ==================== -->
  <g transform="translate(48, 210)">
    <!-- Enclosure Frame -->
    <rect width="1104" height="92" rx="8" fill="#09140F" stroke="#1C382A" stroke-width="1"/>
    
    <!-- Dock Category Tag -->
    <g transform="translate(14, -10)">
      <rect width="210" height="20" rx="3" fill="#0D2117" stroke="#244E38" stroke-width="0.8"/>
      <text x="10" y="13.5" fill="#4ADE80" font-size="9" font-weight="700" letter-spacing="1.2" class="mono">SHARED CAPABILITY ENGINES</text>
    </g>

    <!-- 5 Precision Segmented Cards -->
    <!-- 01: OPERATIONS -->
    <g transform="translate(10, 18)">
      <rect width="210" height="62" rx="5" fill="url(#cardBg)" stroke="#1F4231" stroke-width="0.8"/>
      <line x1="8" y1="0.8" x2="202" y2="0.8" stroke="#376E51" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="18" cy="18" r="2.5" fill="#E3B341"/>
      <text x="28" y="21.5" fill="#F3F4F6" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">OPERATIONS</text>
      <text x="16" y="39" fill="#84A792" font-size="10" class="sans">Field Workflows · Fleet</text>
      <text x="16" y="52" fill="#5E7D6A" font-size="9" class="sans">Weighbridge &amp; Assets</text>
    </g>

    <!-- 02: GEOSPATIAL -->
    <g transform="translate(228, 18)">
      <rect width="210" height="62" rx="5" fill="url(#cardBg)" stroke="#1F4231" stroke-width="0.8"/>
      <line x1="8" y1="0.8" x2="202" y2="0.8" stroke="#376E51" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="18" cy="18" r="2.5" fill="#34D399"/>
      <text x="28" y="21.5" fill="#F3F4F6" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">GEOSPATIAL</text>
      <text x="16" y="39" fill="#84A792" font-size="10" class="sans">Spatial Intelligence · GIS</text>
      <text x="16" y="52" fill="#5E7D6A" font-size="9" class="sans">Drone &amp; Land Boundary</text>
    </g>

    <!-- 03: DATA & AI (Highlight) -->
    <g transform="translate(446, 18)">
      <rect width="212" height="62" rx="5" fill="#12271D" stroke="#2E6B4B" stroke-width="1"/>
      <line x1="8" y1="0.8" x2="204" y2="0.8" stroke="url(#topLineGlow)" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="2.5" fill="#4ADE80"/>
      <text x="28" y="21.5" fill="#F3F4F6" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">DATA &amp; AI</text>
      <text x="16" y="39" fill="#9AE6B4" font-size="10" class="sans">Lakehouse &amp; Pipelines</text>
      <text x="16" y="52" fill="#68A480" font-size="9" class="sans">LLM &amp; Decision Support</text>
    </g>

    <!-- 04: ENTERPRISE -->
    <g transform="translate(666, 18)">
      <rect width="210" height="62" rx="5" fill="url(#cardBg)" stroke="#1F4231" stroke-width="0.8"/>
      <line x1="8" y1="0.8" x2="202" y2="0.8" stroke="#376E51" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="18" cy="18" r="2.5" fill="#34D399"/>
      <text x="28" y="21.5" fill="#F3F4F6" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">ENTERPRISE</text>
      <text x="16" y="39" fill="#84A792" font-size="10" class="sans">ERP &amp; Finance Systems</text>
      <text x="16" y="52" fill="#5E7D6A" font-size="9" class="sans">Supply Chain &amp; Sales</text>
    </g>

    <!-- 05: PLATFORM -->
    <g transform="translate(884, 18)">
      <rect width="210" height="62" rx="5" fill="url(#cardBg)" stroke="#1F4231" stroke-width="0.8"/>
      <line x1="8" y1="0.8" x2="202" y2="0.8" stroke="#376E51" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="18" cy="18" r="2.5" fill="#38BDF8"/>
      <text x="28" y="21.5" fill="#F3F4F6" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">PLATFORM</text>
      <text x="16" y="39" fill="#84A792" font-size="10" class="sans">Cloud Foundation · Mesh</text>
      <text x="16" y="52" fill="#5E7D6A" font-size="9" class="sans">Security &amp; Reliability</text>
    </g>
  </g>

</svg>