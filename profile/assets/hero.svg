<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Agrinas Engineering blueprint hero</title>
  <desc id="desc">Banner animasi bergaya blueprint untuk Agrinas Engineering, menampilkan alur sistem dari lapangan hingga kantor pusat.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="52%" stop-color="#0e1a2a"/>
      <stop offset="100%" stop-color="#0a1422"/>
    </linearGradient>
    <linearGradient id="blueprintLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="blueprintGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2034" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0c1828" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#183147" stroke-width="1"/>
      <path d="M18 0V36 M0 18H36" fill="none" stroke="#12263a" stroke-width="0.7"/>
      <circle cx="18" cy="18" r="1" fill="#27435d" opacity="0.65"/>
    </pattern>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="packetGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="heroRoute" d="M124 360 H1118"/>
    <style>
      .mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      @keyframes pulse {0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes cursor {0%,45%{opacity:1}46%,100%{opacity:0}}
      @keyframes sweep {0%{transform:translateX(-240px);opacity:0}12%{opacity:.45}88%{opacity:.45}100%{transform:translateX(1340px);opacity:0}}
      @keyframes floaty {0%,100%{transform:translateY(0px)}50%{transform:translateY(-2px)}}
      .pulse{animation:pulse 2.8s ease-in-out infinite}.cursor{animation:cursor 1.1s steps(1,end) infinite}.floaty{animation:floaty 5s ease-in-out infinite}.sweep{animation:sweep 8s linear infinite}
    </style>
  </defs>
  <rect width="1280" height="540" rx="24" fill="url(#bg)"/><rect width="1280" height="540" rx="24" fill="url(#grid)"/>
  <rect x="20" y="20" width="1240" height="500" rx="20" fill="none" stroke="#284057"/><rect x="36" y="36" width="1208" height="468" rx="18" fill="none" stroke="#20364b"/>
  <ellipse cx="1080" cy="110" rx="260" ry="120" fill="#60a5fa" opacity="0.06" filter="url(#softBlur)"/><ellipse cx="230" cy="120" rx="250" ry="110" fill="#4ade80" opacity="0.05" filter="url(#softBlur)"/><ellipse cx="920" cy="420" rx="280" ry="120" fill="#f59e0b" opacity="0.04" filter="url(#softBlur)"/>
  <g stroke="#37506a" stroke-width="1" opacity="0.9"><path d="M48 18 v22 M37 29 h22"/><path d="M1232 18 v22 M1221 29 h22"/><path d="M48 500 v22 M37 511 h22"/><path d="M1232 500 v22 M1221 511 h22"/></g>
  <g transform="translate(64 54)"><rect width="286" height="28" rx="14" fill="#0e1d2c" stroke="#30465c"/><circle cx="16" cy="14" r="4" fill="#4ade80" class="pulse"/><text x="30" y="18" fill="#d7e2ee" font-size="11.5" font-weight="700" letter-spacing="1.4" class="mono">AGRINAS / ENGINEERING / BLUEPRINT</text><text x="300" y="18" fill="#86a2bc" font-size="11.5" class="mono">v2</text></g>
  <g transform="translate(64 116)"><text x="0" y="0" fill="#f6fbff" font-size="54" font-weight="780" class="sans">Membangun software</text><text x="0" y="60" fill="#f6fbff" font-size="54" font-weight="780" class="sans">untuk operasional perkebunan.</text><text x="0" y="104" fill="#9db2c7" font-size="18" class="sans">Dari workflow lapangan sampai platform internal, data, geospasial, dan AI.</text><text x="0" y="146" fill="#b7c8d8" font-size="14.5" class="mono">lapangan -&gt; estate -&gt; distrik -&gt; region -&gt; kantor pusat<tspan class="cursor">_</tspan></text></g>
  <g transform="translate(814 92)"><rect x="0" y="0" width="394" height="188" rx="18" fill="url(#blueprintGlow)" stroke="#35506a"/><rect x="0" y="0" width="394" height="34" rx="18" fill="#112132"/><circle cx="22" cy="17" r="4" fill="#ff5f57" opacity="0.75"/><circle cx="38" cy="17" r="4" fill="#febc2e" opacity="0.75"/><circle cx="54" cy="17" r="4" fill="#28c840" opacity="0.75"/><text x="78" y="21" fill="#d7e2ee" font-size="11.5" class="mono">system-board.blueprint</text><g transform="translate(22 56)" class="mono" font-size="12.6"><text x="0" y="0" fill="#8ea7be">field.ops</text><line x1="136" y1="-4" x2="168" y2="-4" stroke="#26455d"/><circle cx="180" cy="-4" r="4" fill="#4ade80" class="pulse"/><text x="196" y="0" fill="#d3f6df">aktif</text><text x="0" y="28" fill="#8ea7be">geo.services</text><line x1="136" y1="24" x2="168" y2="24" stroke="#26455d"/><circle cx="180" cy="24" r="4" fill="#4ade80" class="pulse" style="animation-delay:.5s"/><text x="196" y="28" fill="#d3f6df">aktif</text><text x="0" y="56" fill="#8ea7be">enterprise</text><line x1="136" y1="52" x2="168" y2="52" stroke="#26455d"/><circle cx="180" cy="52" r="4" fill="#f59e0b" class="pulse" style="animation-delay:1s"/><text x="196" y="56" fill="#fde3b0">rilis</text><text x="0" y="84" fill="#8ea7be">data.platform</text><line x1="136" y1="80" x2="168" y2="80" stroke="#26455d"/><circle cx="180" cy="80" r="4" fill="#60a5fa" class="pulse" style="animation-delay:1.4s"/><text x="196" y="84" fill="#d1e6ff">mengalir</text><text x="0" y="112" fill="#8ea7be">ai.runtime</text><line x1="136" y1="108" x2="168" y2="108" stroke="#26455d"/><circle cx="180" cy="108" r="4" fill="#4ade80" class="pulse" style="animation-delay:1.8s"/><text x="196" y="112" fill="#d3f6df">iterasi</text></g></g>
  <g transform="translate(64 448)"><g><rect width="160" height="28" rx="14" fill="#0f1d2c" stroke="#30465c"/><circle cx="16" cy="14" r="3" fill="#f59e0b"/><text x="30" y="18" fill="#d7e2ee" font-size="11.2" class="mono">OPERASIONAL</text></g><g transform="translate(174 0)"><rect width="150" height="28" rx="14" fill="#0f1d2c" stroke="#30465c"/><circle cx="16" cy="14" r="3" fill="#4ade80"/><text x="30" y="18" fill="#d7e2ee" font-size="11.2" class="mono">GEOSPASIAL</text></g><g transform="translate(338 0)"><rect width="150" height="28" rx="14" fill="#0f1d2c" stroke="#30465c"/><circle cx="16" cy="14" r="3" fill="#4ade80"/><text x="30" y="18" fill="#d7e2ee" font-size="11.2" class="mono">ENTERPRISE</text></g><g transform="translate(502 0)"><rect width="140" height="28" rx="14" fill="#0f1d2c" stroke="#30465c"/><circle cx="16" cy="14" r="3" fill="#60a5fa"/><text x="30" y="18" fill="#d7e2ee" font-size="11.2" class="mono">DATA + AI</text></g><g transform="translate(656 0)"><rect width="188" height="28" rx="14" fill="#0f1d2c" stroke="#30465c"/><circle cx="16" cy="14" r="3" fill="#93c5fd"/><text x="30" y="18" fill="#d7e2ee" font-size="11.2" class="mono">PLATFORM + SECURITY</text></g></g>
  <g class="floaty"><path d="M124 360 H1118" stroke="#183045" stroke-width="10" stroke-linecap="round"/><path d="M124 360 H1118" stroke="#2c4a63" stroke-width="2" stroke-linecap="round"/><path d="M124 360 H1118" stroke="url(#blueprintLine)" stroke-width="2" stroke-dasharray="6 10" stroke-linecap="round" opacity="0.95"/><rect x="-240" y="350" width="180" height="20" fill="#7dd3fc" opacity="0.0" class="sweep"/><circle r="5" fill="#f59e0b" filter="url(#packetGlow)"><animateMotion dur="7.8s" repeatCount="indefinite"><mpath href="#heroRoute"/></animateMotion></circle><circle r="2.4" fill="#fff0c7"><animateMotion dur="7.8s" begin="-0.08s" repeatCount="indefinite"><mpath href="#heroRoute"/></animateMotion></circle><circle r="4.2" fill="#4ade80" filter="url(#packetGlow)"><animateMotion dur="7.8s" begin="-3.9s" repeatCount="indefinite"><mpath href="#heroRoute"/></animateMotion></circle><circle r="2" fill="#d9ffe7"><animateMotion dur="7.8s" begin="-3.98s" repeatCount="indefinite"><mpath href="#heroRoute"/></animateMotion></circle></g>
  <g class="mono" text-anchor="middle"><g transform="translate(124 360)"><circle r="18" fill="#0f1b2a" stroke="#f59e0b" stroke-width="1.8"/><circle r="9" fill="#1a2a3c" stroke="#44627c" stroke-width="1"/><circle r="4" fill="#f59e0b" class="pulse"/><text y="-30" fill="#f59e0b" font-size="10">01</text><text y="42" fill="#f6fbff" font-size="12" font-weight="700">LAPANGAN</text><text y="58" fill="#96aac0" font-size="10">mobile + sensor</text></g><g transform="translate(372 360)"><circle r="18" fill="#0f1b2a" stroke="#4ade80" stroke-width="1.8"/><circle r="9" fill="#1a2a3c" stroke="#44627c" stroke-width="1"/><circle r="4" fill="#4ade80" class="pulse" style="animation-delay:.4s"/><text y="-30" fill="#4ade80" font-size="10">02</text><text y="42" fill="#f6fbff" font-size="12" font-weight="700">ESTATE</text><text y="58" fill="#96aac0" font-size="10">ops + planning</text></g><g transform="translate(620 360)"><circle r="20" fill="#0f1b2a" stroke="#4ade80" stroke-width="1.9"/><circle r="10" fill="#1a2a3c" stroke="#44627c" stroke-width="1"/><circle r="4.5" fill="#4ade80" class="pulse" style="animation-delay:.8s"/><text y="-30" fill="#4ade80" font-size="10">03</text><text y="42" fill="#f6fbff" font-size="12" font-weight="700">DISTRIK</text><text y="58" fill="#96aac0" font-size="10">hub data</text></g><g transform="translate(868 360)"><circle r="18" fill="#0f1b2a" stroke="#60a5fa" stroke-width="1.8"/><circle r="9" fill="#1a2a3c" stroke="#44627c" stroke-width="1"/><circle r="4" fill="#60a5fa" class="pulse" style="animation-delay:1.2s"/><text y="-30" fill="#60a5fa" font-size="10">04</text><text y="42" fill="#f6fbff" font-size="12" font-weight="700">REGION</text><text y="58" fill="#96aac0" font-size="10">review + kontrol</text></g><g transform="translate(1118 360)"><circle r="18" fill="#0f1b2a" stroke="#60a5fa" stroke-width="1.8"/><circle r="9" fill="#1a2a3c" stroke="#44627c" stroke-width="1"/><circle r="4" fill="#60a5fa" class="pulse" style="animation-delay:1.6s"/><text y="-30" fill="#60a5fa" font-size="10">05</text><text y="42" fill="#f6fbff" font-size="12" font-weight="700">KANTOR PUSAT</text><text y="58" fill="#96aac0" font-size="10">platform + governance</text></g></g>
