<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Agrinas Engineering — Software for plantations at scale</title>
  <desc id="desc">Animated engineering banner connecting field, estate, district, region, and head office through a shared digital backbone.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0b1116"/>
      <stop offset="100%" stop-color="#08110d"/>
    </linearGradient>

    <radialGradient id="wash" cx="0.18" cy="0.08" r="0.9">
      <stop offset="0%" stop-color="#12351f" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#0d1117" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="busGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="35%" stop-color="#3fb950"/>
      <stop offset="70%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="0.7" stroke-opacity="0.16"/>
      <circle cx="20" cy="20" r="0.7" fill="#8b949e" fill-opacity="0.12"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="heroBus" d="M100 305H1100"/>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

      @keyframes blink {
        0%, 46% { opacity: 1; }
        47%, 100% { opacity: 0; }
      }

      @keyframes breathe {
        0%, 100% { opacity: .28; transform: scale(.9); }
        50% { opacity: .7; transform: scale(1.15); }
      }

      @keyframes dash {
        to { stroke-dashoffset: -220; }
      }

      @keyframes scan {
        0% { transform: translateX(-180px); opacity: 0; }
        12% { opacity: .12; }
        50% { opacity: .06; }
        88% { opacity: .12; }
        100% { transform: translateX(1320px); opacity: 0; }
      }

      .cursor { animation: blink 1.1s steps(1, end) infinite; }
      .flow { animation: dash 12s linear infinite; }
      .pulse { animation: breathe 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse.delay-1 { animation-delay: .7s; }
      .pulse.delay-2 { animation-delay: 1.4s; }
      .scan { animation: scan 10s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="16" fill="url(#wash)"/>
  <rect width="1200" height="430" rx="16" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="429" rx="15.5" fill="none" stroke="#30363d"/>

  <g opacity=".7" stroke="#3fb950" stroke-width="1">
    <path d="M24 16V32M16 24H32"/>
    <path d="M1176 16V32M1168 24H1184"/>
    <path d="M24 398V414M16 406H32"/>
    <path d="M1176 398V414M1168 406H1184"/>
  </g>

  <rect class="scan" x="0" y="0" width="120" height="430" fill="#3fb950" opacity="0.04"/>

  <g transform="translate(58 48)">
    <text class="mono" x="0" y="0" fill="#3fb950" font-size="12" font-weight="700" letter-spacing="1.8">AGRINAS / ENGINEERING</text>
    <rect class="cursor" x="185" y="-11" width="7" height="13" rx="1" fill="#3fb950"/>

    <text class="sans" x="0" y="73" fill="#f0f6fc" font-size="50" font-weight="750" letter-spacing="-1.8">We build software</text>
    <text class="sans" x="0" y="129" fill="#f0f6fc" font-size="50" font-weight="750" letter-spacing="-1.8">for plantations at scale.</text>

    <text class="sans" x="0" y="172" fill="#8b949e" font-size="16">
      Field operations, geospatial systems, enterprise platforms, data infrastructure, and applied AI.
    </text>
  </g>

  <g transform="translate(884 46)">
    <text class="mono" x="0" y="0" fill="#6e7681" font-size="10" letter-spacing="1.4">SYSTEM PATH</text>
    <text class="mono" x="0" y="24" fill="#8b949e" font-size="11">field   -&gt;  estate</text>
    <text class="mono" x="0" y="42" fill="#8b949e" font-size="11">district -&gt;  region</text>
    <text class="mono" x="0" y="60" fill="#8b949e" font-size="11">region   -&gt;  head office</text>
  </g>

  <g>
    <path d="M100 305H1100" stroke="#21262d" stroke-width="5" stroke-linecap="round"/>
    <path d="M100 305H1100" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
    <path class="flow" d="M100 305H1100" stroke="url(#busGradient)" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="8 14" opacity=".75"/>
  </g>

  <circle r="4.2" fill="#3fb950" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite">
      <mpath href="#heroBus"/>
    </animateMotion>
  </circle>
  <circle r="3.2" fill="#58a6ff" filter="url(#glow)">
    <animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite">
      <mpath href="#heroBus"/>
    </animateMotion>
  </circle>

  <g class="sans" text-anchor="middle">
    <g transform="translate(100 305)">
      <circle class="pulse" r="17" fill="none" stroke="#d29922" stroke-width="1"/>
      <circle r="8" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
      <circle r="3" fill="#d29922"/>
      <text y="34" fill="#f0f6fc" font-size="11" font-weight="700">FIELD</text>
      <text y="50" fill="#6e7681" font-size="9">edge ops</text>
    </g>

    <g transform="translate(350 305)">
      <circle class="pulse delay-1" r="16" fill="none" stroke="#3fb950" stroke-width="1"/>
      <circle r="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <circle r="3" fill="#3fb950"/>
      <text y="34" fill="#f0f6fc" font-size="11" font-weight="700">ESTATE</text>
      <text y="50" fill="#6e7681" font-size="9">operations</text>
    </g>

    <g transform="translate(600 305)">
      <circle class="pulse delay-2" r="16" fill="none" stroke="#3fb950" stroke-width="1"/>
      <circle r="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <circle r="3" fill="#3fb950"/>
      <text y="34" fill="#f0f6fc" font-size="11" font-weight="700">DISTRICT</text>
      <text y="50" fill="#6e7681" font-size="9">coordination</text>
    </g>

    <g transform="translate(850 305)">
      <circle class="pulse delay-1" r="16" fill="none" stroke="#3fb950" stroke-width="1"/>
      <circle r="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <circle r="3" fill="#3fb950"/>
      <text y="34" fill="#f0f6fc" font-size="11" font-weight="700">REGION</text>
      <text y="50" fill="#6e7681" font-size="9">oversight</text>
    </g>

    <g transform="translate(1100 305)">
      <circle class="pulse delay-2" r="17" fill="none" stroke="#58a6ff" stroke-width="1"/>
      <circle r="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <circle r="3" fill="#58a6ff"/>
      <text y="34" fill="#f0f6fc" font-size="11" font-weight="700">HEAD OFFICE</text>
      <text y="50" fill="#6e7681" font-size="9">enterprise</text>
    </g>
  </g>

  <g transform="translate(58 397)" class="mono" font-size="10">
    <text x="0" y="0" fill="#6e7681">apps</text>
    <text x="46" y="0" fill="#30363d">/</text>
    <text x="62" y="0" fill="#8b949e">api</text>
    <text x="92" y="0" fill="#30363d">/</text>
    <text x="108" y="0" fill="#8b949e">postgres</text>
    <text x="174" y="0" fill="#30363d">/</text>
    <text x="190" y="0" fill="#8b949e">geo</text>
    <text x="222" y="0" fill="#30363d">/</text>
    <text x="238" y="0" fill="#8b949e">cloud</text>
    <text x="280" y="0" fill="#30363d">/</text>
    <text x="296" y="0" fill="#8b949e">ai</text>

    <text x="1076" y="0" fill="#3fb950" text-anchor="end">INDONESIA</text>
  </g>
</svg>