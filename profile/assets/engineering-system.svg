<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Agrinas Engineering System Architecture</title>
  <desc id="desc">Layered engineering capability architecture stack covering experience, domain, intelligence, platform, and security foundations.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="esBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08100C"/>
      <stop offset="50%" stop-color="#0D1813"/>
      <stop offset="100%" stop-color="#070E0A"/>
    </linearGradient>

    <!-- Tier Background Gradients -->
    <linearGradient id="tierGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#112219" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0C1712" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="tierActiveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#142B20" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E1E16" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="esGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#224031" stroke-width="0.7" stroke-opacity="0.2"/>
    </pattern>

    <!-- Flow Paths between Tiers -->
    <path id="busCol1" d="M120 156 V296"/>
    <path id="busCol2" d="M600 156 V296"/>
    <path id="busCol3" d="M1080 156 V296"/>

    <style>
      .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes liveDotPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      .es-live {
        animation: liveDotPulse 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="370" rx="14" fill="url(#esBg)"/>
  <rect width="1200" height="370" rx="14" fill="url(#esGrid)"/>
  <rect x="0.5" y="0.5" width="1199" height="369" rx="13.5" fill="none" stroke="#1E382B" stroke-width="1"/>

  <!-- Top Header -->
  <g transform="translate(48, 38)">
    <text x="0" y="0" fill="#4ADE80" font-size="10.5" font-weight="700" letter-spacing="2.4" class="mono">ENGINEERING SYSTEM ARCHITECTURE</text>
    <text x="0" y="20" fill="#759983" font-size="12.5" class="sans">Capabilities unified into a single composable, dependable digital stack</text>
  </g>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(1044, 28)" class="mono">
    <rect width="108" height="24" rx="4" fill="#0C1F15" stroke="#1F4733" stroke-width="0.8"/>
    <circle cx="14" cy="12" r="3" fill="#E3B341" class="es-live"/>
    <text x="24" y="15.5" fill="#FEF3C7" font-size="9.5" font-weight="600" letter-spacing="0.8">STACK READY</text>
  </g>

  <!-- Technical Inter-Tier Vertical Bus Lines -->
  <g stroke="#183626" stroke-width="1" stroke-dasharray="2 3">
    <path d="M120 156 V296"/>
    <path d="M600 156 V296" stroke="#25553C"/>
    <path d="M1080 156 V296"/>
  </g>

  <!-- Micro Pulse Packets Traversing the Architecture Stack -->
  <circle r="2" fill="#4ADE80" opacity="0.85">
    <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#busCol2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#E3B341" opacity="0.75">
    <animateMotion dur="3.8s" begin="-1.2s" repeatCount="indefinite"><mpath href="#busCol1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3.8s" begin="-1.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#38BDF8" opacity="0.75">
    <animateMotion dur="3.6s" begin="-2s" repeatCount="indefinite"><mpath href="#busCol3"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3.6s" begin="-2s" repeatCount="indefinite"/>
  </circle>

  <!-- ==================== 4 TIER STACK ==================== -->

  <!-- TIER 1: EXPERIENCE -->
  <g transform="translate(48, 102)">
    <rect width="1104" height="48" rx="6" fill="url(#tierGrad)" stroke="#1D3E2F" stroke-width="0.8"/>
    <line x1="8" y1="0.8" x2="1096" y2="0.8" stroke="#356D50" stroke-width="0.8" stroke-opacity="0.5"/>
    
    <g transform="translate(14, 12)">
      <rect width="112" height="24" rx="4" fill="#132B1F" stroke="#26583E" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="2.5" fill="#34D399"/>
      <text x="22" y="15.5" fill="#F3F4F6" font-size="9.5" font-weight="700" letter-spacing="1" class="mono">EXPERIENCE</text>
    </g>

    <text x="144" y="29" fill="#D1FAE5" font-size="11" font-weight="600" class="mono">Operational Interfaces</text>
    <text x="328" y="29" fill="#759983" font-size="11" class="sans">Web Portals · Mobile Field Applications · Workflow Systems · GIS Spatial Consoles</text>
  </g>

  <!-- TIER 2: DOMAIN CORE -->
  <g transform="translate(48, 160)">
    <rect width="1104" height="48" rx="6" fill="url(#tierGrad)" stroke="#1D3E2F" stroke-width="0.8"/>
    <line x1="8" y1="0.8" x2="1096" y2="0.8" stroke="#356D50" stroke-width="0.8" stroke-opacity="0.35"/>
    
    <g transform="translate(14, 12)">
      <rect width="112" height="24" rx="4" fill="#132B1F" stroke="#26583E" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="2.5" fill="#E3B341"/>
      <text x="22" y="15.5" fill="#F3F4F6" font-size="9.5" font-weight="700" letter-spacing="1" class="mono">DOMAIN CORE</text>
    </g>

    <text x="144" y="29" fill="#FEF3C7" font-size="11" font-weight="600" class="mono">Plantation Business</text>
    <text x="328" y="29" fill="#759983" font-size="11" class="sans">Plantation Lifecycle · Mill Processing · Asset Registry · Spatial Land Bank · Logistics</text>
  </g>

  <!-- TIER 3: INTELLIGENCE ENGINE -->
  <g transform="translate(48, 218)">
    <rect width="1104" height="48" rx="6" fill="url(#tierActiveGrad)" stroke="#2D6B4B" stroke-width="1"/>
    <line x1="8" y1="0.8" x2="1096" y2="0.8" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.6"/>
    
    <g transform="translate(14, 12)">
      <rect width="112" height="24" rx="4" fill="#173B29" stroke="#3A7F59" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="2.5" fill="#4ADE80"/>
      <text x="22" y="15.5" fill="#F3F4F6" font-size="9.5" font-weight="700" letter-spacing="1" class="mono">INTELLIGENCE</text>
    </g>

    <text x="144" y="29" fill="#6EE7B7" font-size="11" font-weight="600" class="mono">Data &amp; Applied AI</text>
    <text x="328" y="29" fill="#A7F3D0" font-size="11" class="sans">Lakehouse Analytics · Spatial Telemetry · Document Intelligence · Agentic Copilots</text>
  </g>

  <!-- TIER 4: FOUNDATION SPLIT (Platform & Security) -->
  <g transform="translate(48, 276)">
    <!-- 4A: PLATFORM & OBSERVABILITY -->
    <g transform="translate(0, 0)">
      <rect width="542" height="42" rx="6" fill="url(#tierGrad)" stroke="#1A382A" stroke-width="0.8"/>
      <circle cx="18" cy="21" r="2.5" fill="#38BDF8"/>
      <text x="28" y="24.5" fill="#E0F2FE" font-size="9.5" font-weight="700" letter-spacing="1" class="mono">PLATFORM · CLOUD · OBSERVABILITY</text>
      <text x="318" y="24.5" fill="#688C77" font-size="9.5" class="sans">K8s · Pipelines · OTel Mesh</text>
    </g>

    <!-- 4B: SECURITY & GOVERNANCE -->
    <g transform="translate(562, 0)">
      <rect width="542" height="42" rx="6" fill="url(#tierGrad)" stroke="#1A382A" stroke-width="0.8"/>
      <circle cx="18" cy="21" r="2.5" fill="#34D399"/>
      <text x="28" y="24.5" fill="#E0F2FE" font-size="9.5" font-weight="700" letter-spacing="1" class="mono">SECURITY · GOVERNANCE · RELIABILITY</text>
      <text x="332" y="24.5" fill="#688C77" font-size="9.5" class="sans">RBAC · Audit · Zero-Trust</text>
    </g>
  </g>

</svg>