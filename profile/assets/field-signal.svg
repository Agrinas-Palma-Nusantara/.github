<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Animated field signal graphic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b1511"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d29922"/>
      <stop offset="0.48" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.18" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#238636" stop-opacity=".14"/>
      <stop offset="1" stop-color="#238636" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="route" d="M86 184 C230 125 333 220 466 160 S720 112 842 160 S1002 203 1118 112"/>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .contour{fill:none;stroke:#2a3d35;stroke-width:1;opacity:.43;stroke-dasharray:5 8;animation:drift 16s linear infinite}
      .minor{fill:none;stroke:#23302a;stroke-width:.8;opacity:.42}
      .pulse{transform-box:fill-box;transform-origin:center;animation:breathe 3s ease-in-out infinite}
      .scan{animation:scan 9s linear infinite}
      @keyframes drift{to{stroke-dashoffset:-120}}
      @keyframes breathe{0%,100%{opacity:.25;transform:scale(.84)}50%{opacity:.9;transform:scale(1.2)}}
      @keyframes scan{0%{transform:translateX(-160px);opacity:0}10%{opacity:.11}90%{opacity:.11}100%{transform:translateX(1280px);opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#wash)"/>
  <rect x=".5" y=".5" width="1199" height="279" rx="17.5" fill="none" stroke="#30363d"/>

  <g opacity=".9">
    <path class="contour" d="M-30 92 C120 10 250 45 318 105 S500 188 620 96 S860 -5 1005 66 S1190 155 1248 102"/>
    <path class="contour" d="M-22 119 C120 41 250 73 326 129 S500 208 632 119 S862 17 1010 88 S1182 179 1242 132" style="animation-delay:-3s"/>
    <path class="contour" d="M-16 148 C128 73 256 100 334 153 S500 227 645 143 S866 45 1016 112 S1178 205 1238 158" style="animation-delay:-6s"/>
    <path class="minor" d="M70 20 C188 90 269 77 352 24"/>
    <path class="minor" d="M782 236 C900 174 1002 178 1160 248"/>
  </g>

  <rect class="scan" x="0" y="0" width="100" height="280" fill="#3fb950" opacity="0"/>

  <path d="M86 184 C230 125 333 220 466 160 S720 112 842 160 S1002 203 1118 112" fill="none" stroke="#21262d" stroke-width="7" stroke-linecap="round"/>
  <path d="M86 184 C230 125 333 220 466 160 S720 112 842 160 S1002 203 1118 112" fill="none" stroke="url(#flow)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="10 16" opacity=".85">
    <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="14s" repeatCount="indefinite"/>
  </path>

  <g>
    <circle cx="86" cy="184" r="15" fill="none" stroke="#d29922" opacity=".34" class="pulse"/>
    <circle cx="86" cy="184" r="5" fill="#d29922"/>
    <circle cx="466" cy="160" r="14" fill="none" stroke="#3fb950" opacity=".34" class="pulse" style="animation-delay:-1s"/>
    <circle cx="466" cy="160" r="5" fill="#3fb950"/>
    <circle cx="842" cy="160" r="14" fill="none" stroke="#3fb950" opacity=".34" class="pulse" style="animation-delay:-2s"/>
    <circle cx="842" cy="160" r="5" fill="#3fb950"/>
    <circle cx="1118" cy="112" r="15" fill="none" stroke="#58a6ff" opacity=".34" class="pulse" style="animation-delay:-1.5s"/>
    <circle cx="1118" cy="112" r="5" fill="#58a6ff"/>
  </g>

  <circle r="4.5" fill="#f2cc60" filter="url(#glow)"><animateMotion dur="8.5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
  <circle r="3.7" fill="#3fb950" filter="url(#glow)"><animateMotion dur="8.5s" begin="-4.25s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>

  <g class="mono" font-size="10" fill="#8b949e" letter-spacing="1.6">
    <text x="44" y="42">FIELD / SYSTEMS / DATA</text>
    <text x="1156" y="248" text-anchor="end">AGRINAS PALMA NUSANTARA</text>
  </g>
</svg>
