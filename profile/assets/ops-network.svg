<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Animated operational network from field to head office">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0b1319"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d29922"/><stop offset=".5" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="main" d="M92 132 H1108"/>
    <path id="data" d="M214 226 C380 186 540 258 716 218 S960 184 1078 222"/>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-in-out infinite}
      .dash{animation:dash 12s linear infinite}
      .dash2{animation:dash2 15s linear infinite}
      @keyframes ring{0%,100%{opacity:.12;transform:scale(.72)}50%{opacity:.7;transform:scale(1.18)}}
      @keyframes dash{to{stroke-dashoffset:-220}}
      @keyframes dash2{to{stroke-dashoffset:180}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="17.5" fill="none" stroke="#30363d"/>

  <g class="mono" font-size="10" fill="#6e7681" letter-spacing="1.2">
    <text x="44" y="38">OPERATING NETWORK</text>
    <text x="1156" y="38" text-anchor="end">EDGE → CORE</text>
  </g>

  <path d="M92 132 H1108" stroke="#21262d" stroke-width="7" stroke-linecap="round"/>
  <path class="dash" d="M92 132 H1108" stroke="url(#rail)" stroke-width="1.5" stroke-dasharray="9 15" stroke-linecap="round" opacity=".8"/>

  <circle r="4.2" fill="#3fb950" filter="url(#g)"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle>
  <circle r="3.4" fill="#58a6ff" filter="url(#g)"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle>

  <path d="M214 226 C380 186 540 258 716 218 S960 184 1078 222" fill="none" stroke="#1f2d37" stroke-width="5" stroke-linecap="round"/>
  <path class="dash2" d="M214 226 C380 186 540 258 716 218 S960 184 1078 222" fill="none" stroke="#3fb950" stroke-width="1.1" stroke-dasharray="5 13" opacity=".38"/>
  <circle r="3.2" fill="#d29922" filter="url(#g)"><animateMotion dur="9.5s" repeatCount="indefinite"><mpath href="#data"/></animateMotion></circle>

  <g stroke="#30363d" stroke-width="1" stroke-dasharray="3 6">
    <path d="M92 144 V204"/><path d="M346 144 V204"/><path d="M600 144 V204"/><path d="M854 144 V204"/><path d="M1108 144 V204"/>
  </g>

  <g text-anchor="middle" class="sans">
    <g transform="translate(92 132)"><circle class="ring" r="20" fill="none" stroke="#d29922"/><circle r="9" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/><circle r="3" fill="#d29922"/><text y="38" fill="#f0f6fc" font-size="11" font-weight="700">LAPANGAN</text><text y="54" fill="#6e7681" font-size="9">eksekusi</text></g>
    <g transform="translate(346 132)"><circle class="ring" r="19" fill="none" stroke="#3fb950" style="animation-delay:-.6s"/><circle r="9" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/><circle r="3" fill="#3fb950"/><text y="38" fill="#f0f6fc" font-size="11" font-weight="700">ESTATE</text><text y="54" fill="#6e7681" font-size="9">operasi</text></g>
    <g transform="translate(600 132)"><circle class="ring" r="19" fill="none" stroke="#3fb950" style="animation-delay:-1.2s"/><circle r="9" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/><circle r="3" fill="#3fb950"/><text y="38" fill="#f0f6fc" font-size="11" font-weight="700">DISTRIK</text><text y="54" fill="#6e7681" font-size="9">koordinasi</text></g>
    <g transform="translate(854 132)"><circle class="ring" r="19" fill="none" stroke="#3fb950" style="animation-delay:-1.8s"/><circle r="9" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/><circle r="3" fill="#3fb950"/><text y="38" fill="#f0f6fc" font-size="11" font-weight="700">REGION</text><text y="54" fill="#6e7681" font-size="9">review</text></g>
    <g transform="translate(1108 132)"><circle class="ring" r="20" fill="none" stroke="#58a6ff" style="animation-delay:-2.4s"/><circle r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/><circle r="3" fill="#58a6ff"/><text y="38" fill="#f0f6fc" font-size="11" font-weight="700">KANTOR PUSAT</text><text y="54" fill="#6e7681" font-size="9">keputusan</text></g>
  </g>

  <g class="mono" font-size="9.5" fill="#8b949e" text-anchor="middle">
    <text x="214" y="254">OPERASIONAL</text><text x="414" y="254">GEOSPASIAL</text><text x="614" y="254">ENTERPRISE</text><text x="814" y="254">DATA + AI</text><text x="1014" y="254">PLATFORM</text>
  </g>
</svg>
