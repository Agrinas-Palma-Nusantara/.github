<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Agrinas system map blueprint</title>
  <desc id="desc">Peta sistem bergaya blueprint yang menunjukkan alur operasional perkebunan dan fondasi kapabilitas digital.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a1422"/><stop offset="100%" stop-color="#0d1b2d"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="45%" stop-color="#4ade80"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#173047" stroke-width="1"/><path d="M16 0V32 M0 16H32" fill="none" stroke="#12273b" stroke-width="0.7"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="route" d="M130 134 H1150"/>
    <style>.mono{font-family:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes floaty{0%,100%{transform:translateY(0px)}50%{transform:translateY(-2px)}}.pulse{animation:pulse 2.8s ease-in-out infinite}.floaty{animation:floaty 4.8s ease-in-out infinite}</style>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/><rect width="1280" height="420" rx="24" fill="url(#grid)"/><rect x="22" y="22" width="1236" height="376" rx="20" fill="none" stroke="#284057"/>
  <g transform="translate(48 52)"><text x="0" y="0" fill="#4ade80" font-size="12" font-weight="700" letter-spacing="2" class="mono">02 / PETA SISTEM</text><text x="0" y="30" fill="#f6fbff" font-size="28" font-weight="760" class="sans">Satu rantai operasional, satu aliran data.</text><text x="0" y="54" fill="#9db2c7" font-size="15" class="sans">Operasional, geospasial, enterprise, platform, dan AI berjalan di backbone yang sama.</text></g>
  <g><path d="M130 134 H1150" stroke="#183045" stroke-width="10" stroke-linecap="round"/><path d="M130 134 H1150" stroke="#2c4a63" stroke-width="2" stroke-linecap="round"/><path d="M130 134 H1150" stroke="url(#line)" stroke-width="2" stroke-dasharray="6 10" stroke-linecap="round" opacity="0.95"/><circle r="4.8" fill="#f59e0b" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle><circle r="4.2" fill="#4ade80" filter="url(#glow)"><animateMotion dur="8s" begin="-4s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle><circle r="2.1" fill="#ffffff" opacity="0.85"><animateMotion dur="8s" begin="-0.08s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle></g>
  <g class="mono" text-anchor="middle"><g transform="translate(130 134)"><circle r="18" fill="#0f1b2a" stroke="#f59e0b" stroke-width="1.8"/><circle r="4" fill="#f59e0b" class="pulse"/><text y="-28" fill="#f59e0b" font-size="10">01</text><text y="44" fill="#f6fbff" font-size="12" font-weight="700">LAPANGAN</text></g><g transform="translate(385 134)"><circle r="18" fill="#0f1b2a" stroke="#4ade80" stroke-width="1.8"/><circle r="4" fill="#4ade80" class="pulse" style="animation-delay:.4s"/><text y="-28" fill="#4ade80" font-size="10">02</text><text y="44" fill="#f6fbff" font-size="12" font-weight="700">ESTATE</text></g><g transform="translate(640 134)"><circle r="20" fill="#0f1b2a" stroke="#4ade80" stroke-width="1.9"/><circle r="4.5" fill="#4ade80" class="pulse" style="animation-delay:.8s"/><text y="-28" fill="#4ade80" font-size="10">03</text><text y="44" fill="#f6fbff" font-size="12" font-weight="700">DISTRIK</text></g><g transform="translate(895 134)"><circle r="18" fill="#0f1b2a" stroke="#60a5fa" stroke-width="1.8"/><circle r="4" fill="#60a5fa" class="pulse" style="animation-delay:1.2s"/><text y="-28" fill="#60a5fa" font-size="10">04</text><text y="44" fill="#f6fbff" font-size="12" font-weight="700">REGION</text></g><g transform="translate(1150 134)"><circle r="18" fill="#0f1b2a" stroke="#60a5fa" stroke-width="1.8"/><circle r="4" fill="#60a5fa" class="pulse" style="animation-delay:1.6s"/><text y="-28" fill="#60a5fa" font-size="10">05</text><text y="44" fill="#f6fbff" font-size="12" font-weight="700">KANTOR PUSAT</text></g></g>
  <g class="floaty" transform="translate(74 224)"><rect width="220" height="124" rx="18" fill="#0f1d2c" stroke="#35506a"/><text x="20" y="28" fill="#f59e0b" font-size="11.5" font-weight="700" letter-spacing="1.2" class="mono">OPERASIONAL</text><text x="20" y="54" fill="#f6fbff" font-size="15" font-weight="650" class="sans">Tempat kerja benar-benar terjadi.</text><text x="20" y="78" fill="#9db2c7" font-size="12.5" class="sans">Perencanaan, eksekusi, aset, logistik, dan workflow harian.</text></g>
  <g class="floaty" transform="translate(320 224)"><rect width="220" height="124" rx="18" fill="#0f1d2c" stroke="#35506a"/><text x="20" y="28" fill="#4ade80" font-size="11.5" font-weight="700" letter-spacing="1.2" class="mono">GEOSPASIAL</text><text x="20" y="54" fill="#f6fbff" font-size="15" font-weight="650" class="sans">Peta dan konteks lahan selalu ikut.</text><text x="20" y="78" fill="#9db2c7" font-size="12.5" class="sans">Data spasial, visibilitas lapangan, dan intelligence berbasis lokasi.</text></g>
  <g class="floaty" transform="translate(566 224)"><rect width="220" height="124" rx="18" fill="#0f1d2c" stroke="#35506a"/><text x="20" y="28" fill="#4ade80" font-size="11.5" font-weight="700" letter-spacing="1.2" class="mono">ENTERPRISE</text><text x="20" y="54" fill="#f6fbff" font-size="15" font-weight="650" class="sans">Approval, pelaporan, dan pengikat proses.</text><text x="20" y="78" fill="#9db2c7" font-size="12.5" class="sans">Sistem lintas unit yang menjaga proses bisnis tetap bergerak.</text></g>
  <g class="floaty" transform="translate(812 224)"><rect width="394" height="124" rx="18" fill="#0f1d2c" stroke="#35506a"/><text x="20" y="28" fill="#60a5fa" font-size="11.5" font-weight="700" letter-spacing="1.2" class="mono">DATA + AI + PLATFORM</text><text x="20" y="54" fill="#f6fbff" font-size="15" font-weight="650" class="sans">Fondasi bersama di bawah seluruh rantai.</text><text x="20" y="78" fill="#9db2c7" font-size="12.5" class="sans">Pipeline, API, cloud, observability, analitik, document intelligence, dan AI terapan.</text></g>
</svg>