<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Agrinas system map — field to head office</title>
  <desc id="desc">Animated topology showing plantation operations connected across field, estate, district, region, and head office with shared digital capabilities.</desc>

  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a1210"/>
    </linearGradient>

    <linearGradient id="topologyLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="35%" stop-color="#3fb950"/>
      <stop offset="70%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <pattern id="mapGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="0.7" stroke-opacity=".14"/>
    </pattern>

    <filter id="packetGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="mainRoute" d="M96 136H1104"/>
    <path id="sharedRoute" d="M96 238H1104"/>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

      @keyframes dashForward { to { stroke-dashoffset: -160; } }
      @keyframes dashBack { to { stroke-dashoffset: 160; } }
      @keyframes pulse {
        0%, 100% { opacity: .2; }
        50% { opacity: .8; }
      }

      .forward { animation: dashForward 9s linear infinite; }
      .back { animation: dashBack 12s linear infinite; }
      .blink { animation: pulse 2.8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="16" fill="url(#mapBg)"/>
  <rect width="1200" height="360" rx="16" fill="url(#mapGrid)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="15.5" fill="none" stroke="#30363d"/>

  <g transform="translate(48 40)">
    <text class="mono" x="0" y="0" fill="#3fb950" font-size="11" font-weight="700" letter-spacing="1.8">SYSTEM MAP / 01</text>
    <text class="sans" x="0" y="28" fill="#f0f6fc" font-size="17" font-weight="650">Field to head office, one operational chain.</text>
    <text class="sans" x="0" y="50" fill="#8b949e" font-size="12">Shared workflow and data underneath. Less handoff friction, more traceability.</text>
  </g>

  <g transform="translate(1050 40)" class="mono" text-anchor="end">
    <text x="102" y="0" fill="#6e7681" font-size="9.5" letter-spacing="1.2">TOPOLOGY</text>
    <text x="102" y="20" fill="#8b949e" font-size="10">edge -&gt; core</text>
  </g>

  <path d="M96 136H1104" stroke="#21262d" stroke-width="5" stroke-linecap="round"/>
  <path d="M96 136H1104" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
  <path class="forward" d="M96 136H1104" stroke="url(#topologyLine)" stroke-width="1.3" stroke-dasharray="7 12" opacity=".78"/>

  <circle r="4" fill="#3fb950" filter="url(#packetGlow)">
    <animateMotion dur="6.8s" repeatCount="indefinite">
      <mpath href="#mainRoute"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#58a6ff" filter="url(#packetGlow)">
    <animateMotion dur="6.8s" begin="-3.4s" repeatCount="indefinite">
      <mpath href="#mainRoute"/>
    </animateMotion>
  </circle>

  <g class="sans" text-anchor="middle">
    <g transform="translate(96 136)">
      <circle r="10" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
      <circle r="3" fill="#d29922"/>
      <text y="31" fill="#f0f6fc" font-size="10.5" font-weight="700">FIELD</text>
      <text y="46" fill="#6e7681" font-size="8.8">mobile · field ops</text>
    </g>
    <g transform="translate(348 136)">
      <circle r="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <circle r="3" fill="#3fb950"/>
      <text y="31" fill="#f0f6fc" font-size="10.5" font-weight="700">ESTATE</text>
      <text y="46" fill="#6e7681" font-size="8.8">operations · assets</text>
    </g>
    <g transform="translate(600 136)">
      <circle r="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <circle r="3" fill="#3fb950"/>
      <text y="31" fill="#f0f6fc" font-size="10.5" font-weight="700">DISTRICT</text>
      <text y="46" fill="#6e7681" font-size="8.8">review · coordination</text>
    </g>
    <g transform="translate(852 136)">
      <circle r="10" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <circle r="3" fill="#3fb950"/>
      <text y="31" fill="#f0f6fc" font-size="10.5" font-weight="700">REGION</text>
      <text y="46" fill="#6e7681" font-size="8.8">control · reporting</text>
    </g>
    <g transform="translate(1104 136)">
      <circle r="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <circle r="3" fill="#58a6ff"/>
      <text y="31" fill="#f0f6fc" font-size="10.5" font-weight="700">HEAD OFFICE</text>
      <text y="46" fill="#6e7681" font-size="8.8">enterprise · governance</text>
    </g>
  </g>

  <g stroke="#30363d" stroke-width="1" stroke-dasharray="3 5">
    <path d="M96 146V238"/>
    <path d="M348 146V238"/>
    <path d="M600 146V238"/>
    <path d="M852 146V238"/>
    <path d="M1104 146V238"/>
  </g>

  <g fill="#3fb950">
    <circle class="blink" cx="96" cy="205" r="2.2"/>
    <circle class="blink" cx="348" cy="215" r="2.2" style="animation-delay:.5s"/>
    <circle class="blink" cx="600" cy="197" r="2.2" style="animation-delay:1s"/>
    <circle class="blink" cx="852" cy="218" r="2.2" style="animation-delay:1.5s"/>
    <circle class="blink" cx="1104" cy="202" r="2.2" style="animation-delay:2s"/>
  </g>

  <path d="M96 238H1104" stroke="#21262d" stroke-width="5" stroke-linecap="round"/>
  <path d="M96 238H1104" stroke="#30363d" stroke-width="1.2" stroke-linecap="round"/>
  <path class="back" d="M96 238H1104" stroke="#3fb950" stroke-width="1.1" stroke-dasharray="5 13" opacity=".45"/>

  <circle r="3.2" fill="#d29922" filter="url(#packetGlow)">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#sharedRoute"/>
    </animateMotion>
  </circle>

  <g class="mono" text-anchor="middle" font-size="9.5">
    <g transform="translate(48 282)">
      <rect width="204" height="42" rx="7" fill="#111820" stroke="#30363d"/>
      <circle cx="16" cy="21" r="2.5" fill="#d29922"/>
      <text x="112" y="24" fill="#c9d1d9">OPERATIONS</text>
    </g>

    <g transform="translate(272 282)">
      <rect width="204" height="42" rx="7" fill="#111820" stroke="#30363d"/>
      <circle cx="16" cy="21" r="2.5" fill="#3fb950"/>
      <text x="112" y="24" fill="#c9d1d9">GEOSPATIAL</text>
    </g>

    <g transform="translate(496 282)">
      <rect width="204" height="42" rx="7" fill="#111820" stroke="#30363d"/>
      <circle cx="16" cy="21" r="2.5" fill="#3fb950"/>
      <text x="112" y="24" fill="#c9d1d9">ENTERPRISE</text>
    </g>

    <g transform="translate(720 282)">
      <rect width="204" height="42" rx="7" fill="#111820" stroke="#30363d"/>
      <circle cx="16" cy="21" r="2.5" fill="#3fb950"/>
      <text x="112" y="24" fill="#c9d1d9">DATA + AI</text>
    </g>

    <g transform="translate(944 282)">
      <rect width="208" height="42" rx="7" fill="#111820" stroke="#30363d"/>
      <circle cx="16" cy="21" r="2.5" fill="#58a6ff"/>
      <text x="114" y="24" fill="#c9d1d9">PLATFORM + SEC</text>
    </g>
  </g>

  <g stroke="#30363d" stroke-width="1">
    <path d="M150 238V282"/>
    <path d="M374 238V282"/>
    <path d="M598 238V282"/>
    <path d="M822 238V282"/>
    <path d="M1048 238V282"/>
  </g>
</svg>