name: aws-build-push

on:
  workflow_call:
    inputs:
      ecr_repo:
        description: Nama repository ECR (tanpa registry)
        type: string
        required: true
      dockerfile:
        description: Path Dockerfile
        type: string
        default: Dockerfile
      context:
        description: Build context
        type: string
        default: .
      aws_region:
        description: AWS region
        type: string
        default: ap-southeast-3
      role_arn:
        description: IAM role ARN untuk OIDC
        type: string
        default: arn:aws:iam::002530139786:role/github-actions-ecr-push
    outputs:
      digest:
        description: Digest image yang di-push
        value: ${{ jobs.build.outputs.digest }}
      tag:
        description: Tag image (git SHA)
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repo }}:${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Image pushed ke ECR"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| Repo | \`${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repo }}\` |"
            echo "| Tag | \`${{ github.sha }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
