name: aws-build-push

on:
  workflow_call:
    inputs:
      ecr_repo:
        description: Nama repository ECR (tanpa registry)
        type: string
        required: true
      dockerfile:
        description: Path Dockerfile
        type: string
        default: Dockerfile
      context:
        description: Build context
        type: string
        default: .
      aws_region:
        description: "AWS region (fallback: org variable AWS_REGION)"
        type: string
        default: ''
      role_arn:
        description: "IAM role ARN (fallback: org variable ROLE_ECR_PUSH_ARN)"
        type: string
        default: ''
      env_secret_id:
        description: "Secret (string .env) yang ditulis ke env_file_path sebelum build"
        type: string
        default: ''
      env_file_path:
        description: Path file env yang ditulis
        type: string
        default: secret.env
    outputs:
      digest:
        description: Digest image yang di-push
        value: ${{ jobs.build.outputs.digest }}
      tag:
        description: Tag image (git SHA)
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-build-push-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn || vars.ROLE_ECR_PUSH_ARN }}
          aws-region: ${{ inputs.aws_region || vars.AWS_REGION }}

      - name: Fetch build env dari Secrets Manager
        if: inputs.env_secret_id != ''
        run: |
          aws secretsmanager get-secret-value --secret-id "${{ inputs.env_secret_id }}" \
            --query SecretString --output text > "${{ inputs.env_file_path }}"
          echo "build env written: $(wc -l < "${{ inputs.env_file_path }}") baris -> ${{ inputs.env_file_path }}"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repo }}:${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Image pushed ke ECR"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| Repo | \`${{ steps.ecr.outputs.registry }}/${{ inputs.ecr_repo }}\` |"
            echo "| Tag | \`${{ github.sha }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
